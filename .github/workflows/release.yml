name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write   # upload build artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: macos-14   # arm64 native; x86_64 via universal SDK
            goos: darwin
            goarch: arm64
          - runner: macos-14
            goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        env:
          CGO_CFLAGS: -DSQLITE_ENABLE_FTS5
        run: go test -tags sqlite_fts5 ./...

      - name: Build binary
        env:
          CGO_ENABLED: "1"   # cgo defaults to 0 when GOARCH differs from host
          CGO_CFLAGS: -DSQLITE_ENABLE_FTS5
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -tags sqlite_fts5 \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/kb-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Smoke test (native build)
        if: matrix.goos == 'linux' || matrix.goarch == 'arm64'
        run: ./dist/kb-${{ matrix.goos }}-${{ matrix.goarch }} --help >/dev/null

      - name: Check format (cross-compiled)
        if: matrix.goos == 'darwin' && matrix.goarch == 'amd64'
        run: file dist/kb-darwin-amd64 | grep -q 'x86_64'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/kb-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
      actions: read     # download build artifacts
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect and checksum
        run: |
          mkdir -p dist
          cp artifacts/kb-* dist/
          (cd dist && sha256sum kb-* > SHA256SUMS)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "kb $GITHUB_REF_NAME" \
            --generate-notes --verify-tag