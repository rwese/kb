name: release (forgejo)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # Forgejo mirrors do not emit push events; use the instance UI (or
    # dispatch below) to run this after syncing a tag into the mirror.

env:
  REPO: wese/kb

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }}/${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # upload build artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          # CGO (sqlite + FTS5) makes every variant a native-or-cross-gcc
          # build. linux/amd64 is native to the docker runner; linux/arm64
          # needs a cross toolchain. darwin cannot be built here: no macOS
          # runner and CGO cannot cross a foreign host without an SDK -
          # macOS binaries come from the GitHub Actions release run or
          # `just release` locally.
          - goos: linux
            goarch: amd64
            variant: standard
            cc: ""
          - goos: linux
            goarch: arm64
            variant: standard
            cc: aarch64-linux-gnu-gcc
          # To ship the opt-in ONNX embedder variant in releases, add rows
          # with variant: onnx once internal/embed/onnx exists (build.sh
          # refuses the variant until the sources land). The resulting asset
          # ships the onnxruntime shared library bundled next to the binary.
    steps:
      - name: Cross toolchain (arm64)
        if: matrix.cc != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends crossbuild-essential-arm64
          aarch64-linux-gnu-gcc -v >/dev/null 2>&1 || { echo "cross gcc missing" >&2; exit 1; }

      - uses: https://github.com/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CC: ${{ matrix.cc }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! -f scripts/build.sh ]]; then
            echo "scripts/build.sh missing - did the mirror sync complete?" >&2
            exit 1
          fi
          bash scripts/build.sh \
            --os ${{ matrix.goos }} --arch ${{ matrix.goarch }} \
            --variant ${{ matrix.variant }} --version "$VERSION"

      - name: Smoke test (native amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./dist/kb-${{ matrix.goos }}-${{ matrix.goarch }} --help >/dev/null

      - name: Validate cross-built arch
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: file dist/kb-${{ matrix.goos }}-${{ matrix.goarch }} | grep -q 'aarch64'

      - uses: https://github.com/actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kb-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.variant != 'standard' && format('-{0}', matrix.variant) || '' }}
          path: dist/kb-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Forgejo release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # download build artifacts
    steps:
      - uses: https://github.com/actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect and checksum
        run: |
          apt-get update >/dev/null 2>&1
          apt-get install -y --no-install-recommends jq curl >/dev/null
          mkdir -p dist
          cp artifacts/kb-* dist/
          (cd dist && sha256sum kb-* > SHA256SUMS)
      # Requires a repo secret RELEASE_TOKEN (PAT with repo scope on this
      # Forgejo). Without it, artifacts stay attached to the run.
      - name: Create release and upload assets
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
          INSTANCE_URL: ${{ github.server_url }}
          API: ${{ github.api_url }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "RELEASE_TOKEN secret not set: skipping release (artifacts remain on the run)." >&2
            echo "Set it via: forgejo admin panel -> this repo -> Settings -> Actions -> Secrets" >&2
            exit 0
          fi
          AUTH="Authorization: token $RELEASE_TOKEN"
          BODY="Automated Forgejo build of kb $TAG. Pick the asset matching
          your platform; standard builds ship bm25 + ollama-remote options,
          onnx*-suffixed builds bundle the opt-in ONNX embedder."
          RELEASE_JSON=$(curl -sfS -X POST "$API/repos/$REPO/releases" \
            -H "$AUTH" -H "Content-Type: application/json" \
            -d "$(jq -n --arg tag "$TAG" --arg body "$BODY" \
                 '{tag_name: $tag, name: $tag, body: $body, draft: false}')") || {
              echo "release create failed (does $TAG exist on this instance?)" >&2
              exit 1
          }
          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
          cd dist
          for asset in *; do
            curl -sfS -X POST "$API/repos/$REPO/releases/$RELEASE_ID/assets?name=$asset" \
              -H "$AUTH" -F "attachment=@$asset" >/dev/null \
              || { echo "asset upload failed: $asset" >&2; exit 1; }
          done
          echo "release $TAG published"
